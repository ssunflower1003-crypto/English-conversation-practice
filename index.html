<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ec5f7a">
<title>英文會話練習 - 單元選單</title>
<style>
  :root{
    --pink:#ec5f7a;
    --pink-light:#fbdbe0;
    --blue:#2f7fd1;
    --ink:#2c2c34;
    --bg:#faf7f2;
    --card:#ffffff;
    --border:#eee0d8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Noto Sans TC","Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:40px;
  }
  header.hero{
    background:linear-gradient(135deg,var(--pink),#f7929f);
    color:#fff;
    padding:34px 16px 44px;
    text-align:center;
    border-radius:0 0 30px 30px;
  }
  header.hero h1{margin:0 0 4px;font-size:24px;}
  header.hero p{margin:0;font-size:13px;opacity:.9;}
  main{
    max-width:720px;
    margin:-24px auto 0;
    padding:0 16px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;
  }
  a.unit-card, div.unit-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 12px;
    text-align:center;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 4px 14px rgba(0,0,0,0.05);
    display:block;
    transition:transform .1s;
  }
  a.unit-card:active{transform:scale(.97);}
  .unit-card .num{
    width:44px;height:44px;
    line-height:44px;
    border-radius:50%;
    background:var(--pink);
    color:#fff;
    font-weight:800;
    margin:0 auto 10px;
    font-size:15px;
  }
  .unit-card .title{font-weight:700;font-size:14px;}
  .unit-card .topic{font-size:12px;color:#888;margin-top:2px;}
  div.unit-card{
    opacity:.45;
    cursor:default;
  }
  div.unit-card .num{background:#bbb;}
  div.unit-card .topic{color:#aaa;}
  p.note{
    text-align:center;
    color:#999;
    font-size:12px;
    margin-top:28px;
  }
</style>
</head>
<body>

<header class="hero">
  <h1>英文會話練習</h1>
  <p>7天就能用英文行遍全世界 · 點選單元開始練習</p>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="note">尚未建立的單元會先顯示灰色，之後上傳新單元後在下方 units 清單裡把該單元改成連結即可。</p>
</main>

<script>
// 在這裡維護所有單元。ready:true 代表已經上傳，會變成可點的連結；
// ready:false 會顯示成灰色的「敬請期待」卡片。
// 之後新增一個單元時，只要把該單元改成 ready:true 並補上 topic 即可。
const units = [
  {n:1,  topic:"Go Home 家",   ready:true},
  {n:2,  topic:"",             ready:false},
  {n:3,  topic:"",             ready:false},
  {n:4,  topic:"",             ready:false},
  {n:5,  topic:"",             ready:false},
  {n:6,  topic:"",             ready:false},
  {n:7,  topic:"",             ready:false},
  {n:8,  topic:"",             ready:false},
  {n:9,  topic:"",             ready:false},
  {n:10, topic:"",             ready:false},
];

document.getElementById('grid').innerHTML = units.map(u => {
  const inner = `
    <div class="num">${u.n}</div>
    <div class="title">Unit ${u.n}</div>
    <div class="topic">${u.ready ? u.topic : '敬請期待'}</div>
  `;
  return u.ready
    ? `<a class="unit-card" href="unit${u.n}/">${inner}</a>`
    : `<div class="unit-card">${inner}</div>`;
}).join('');
</script>

</body>
</html>
