/* ---------------- SPEECH ---------------- */

let currentBtn = null;
function speak(text, btn){
  if(!('speechSynthesis' in window)){
    alert('您的瀏覽器不支援語音朗讀功能');
    return;
  }
  const synth = window.speechSynthesis;
  synth.cancel();
  if(currentBtn) currentBtn.classList.remove('playing');
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.92;
  if(btn){
    btn.classList.add('playing');
    currentBtn = btn;
    utter.onend = () => btn.classList.remove('playing');
    utter.onerror = () => btn.classList.remove('playing');
  }
  // Chrome sometimes silently drops an utterance if speak() is called
  // in the same tick as cancel(); a tiny delay makes playback reliable.
  setTimeout(() => synth.speak(utter), 40);
}

// Sentences/words are stored here and referenced by index from the button's
// data-speak-id attribute, instead of being written into an onclick='...'
// attribute. This avoids breaking on sentences containing apostrophes
// (e.g. "Don't", "Let's", "I've") which previously terminated the
// single-quoted attribute early and silently broke that button.
const speakRegistry = [];
function spkBtn(text){
  const id = speakRegistry.length;
  speakRegistry.push(text);
  return `<button class="spk" data-speak-id="${id}" aria-label="播放發音">🔊</button>`;
}

document.addEventListener('click', e=>{
  const btn = e.target.closest('button.spk');
  if(btn){
    const t = speakRegistry[Number(btn.dataset.speakId)];
    if(t !== undefined) speak(t, btn);
    return;
  }
  const chip = e.target.closest('.chip[data-speak-id]');
  if(chip){
    const t = speakRegistry[Number(chip.dataset.speakId)];
    if(t !== undefined) speak(t, null);
  }
});

function withHighlights(text, hl){
  if(!hl || !hl.length) return text;
  let out = text;
  hl.forEach(h=>{
    out = out.replace(h, `<span class="highlight">${h}</span>`);
  });
  return out;
}

/* ---------------- RENDER ---------------- */

function renderConversation(){
  const el = document.getElementById('conv-list');
  el.innerHTML = conversation.map(l => `
    <div class="line">
      <div class="speaker-tag ${l.sp}">${l.sp}</div>
      <div class="line-content">
        <div class="en-row">
          <span class="en-text">${withHighlights(l.en, l.hl)}</span>
          ${spkBtn(l.en)}
        </div>
        <div class="zh-text">${l.zh}</div>
      </div>
    </div>
  `).join('');

  document.getElementById('conv-addvocab').innerHTML = renderAddVocab(convAddVocab);
}

function renderAddVocab(list){
  return list.map(v => `
    <div class="addvocab-item">
      <div class="addvocab-head">
        <span>${v.word}</span><span class="pos">(${v.pos})</span>
        <span class="zh-text" style="margin:0;">${v.zh}</span>
        ${spkBtn(v.word)}
      </div>
      <div class="sentence-row" style="border:none;padding-top:4px;">
        <div style="flex:1;">
          <div class="en-text" style="font-size:14px;">${v.ex_en}</div>
          <div class="zh-text">${v.ex_zh}</div>
        </div>
        ${spkBtn(v.ex_en)}
      </div>
    </div>
  `).join('');
}

function renderSentences(){
  const el = document.getElementById('sentence-list');
  el.innerHTML = sentences.map(s => `
    <div class="sentence-row">
      <div style="flex:1;">
        <div class="en-text">${withHighlights(s.en, s.hl)}</div>
        <div class="zh-text">${s.zh}</div>
      </div>
      ${spkBtn(s.en)}
    </div>
  `).join('');

  document.getElementById('sub-box-1').innerHTML = renderSub(sub1);
  document.getElementById('sub-box-2').innerHTML = renderSub(sub2);

  document.getElementById('sentence-addvocab').innerHTML = renderAddVocab(sentenceAddVocab);
}

function renderSub(sub){
  return `
    <h4>${sub.label}</h4>
    <div class="chip-row">
      ${sub.chips.map(c => {
        const id = speakRegistry.length;
        speakRegistry.push(c[0]);
        return `<div class="chip" data-speak-id="${id}">${c[0]}<br><span style="font-size:11px;color:#888;">${c[1]}</span></div>`;
      }).join('')}
    </div>
    <div class="template">${sub.template}<br><span style="color:#999;">${sub.template_zh}</span></div>
  `;
}

function renderVocab(){
  const el = document.getElementById('vocab-list');
  el.innerHTML = vocabCategories.map((cat, i) => `
    <div class="vocab-cat-title"><span class="num">${i+1}</span>${cat.title} ${cat.zh}</div>
    <div class="vocab-grid">
      ${cat.words.map(w => `
        <div class="vocab-item">
          <div class="vocab-word-block">
            <span class="word">${w[0]}</span>
            ${w[1] ? `<span class="ipa">[${w[1]}]</span>` : ''}
            <div class="zh">${w[2]}</div>
          </div>
          ${spkBtn(w[0].split(' / ')[0].split(' ')[0] === w[0] ? w[0] : w[0])}
        </div>
      `).join('')}
    </div>
  `).join('');
}

function renderQA(){
  const el = document.getElementById('qa-list');
  el.innerHTML = qaList.map((qa, i) => `
    <div class="qa-card">
      <div class="qa-label">會話${['一','二','三','四','五'][i] || (i+1)}</div>
      <div class="en-row">
        <span class="en-text"><b>Q</b>&nbsp;${qa.q_en}</span>
        ${spkBtn(qa.q_en)}
      </div>
      <div class="zh-text" style="margin-bottom:8px;">${qa.q_zh}</div>
      <div class="en-row">
        <span class="en-text" style="color:var(--pink);"><b>A</b>&nbsp;${qa.a_en}</span>
        ${spkBtn(qa.a_en)}
      </div>
      <div class="zh-text">${qa.a_zh}</div>
    </div>
  `).join('');
}

function renderIdioms(){
  const el = document.getElementById('idioms-list');
  el.innerHTML = idioms.map(id => `
    <div class="idiom-card">
      <div class="en-row">
        <span class="idiom-phrase">${id.phrase}</span>
        <span class="idiom-zh">${id.zh}</span>
        ${spkBtn(id.phrase)}
      </div>
      <div class="sentence-row" style="border:none;padding-top:8px;">
        <div style="flex:1;">
          <div class="en-text" style="font-size:14px;">${withHighlights(id.ex_en,[id.phrase])}</div>
          <div class="zh-text">${id.ex_zh}</div>
        </div>
        ${spkBtn(id.ex_en)}
      </div>
    </div>
  `).join('');
}

renderConversation();
renderSentences();
renderVocab();
renderQA();
renderIdioms();

/* ---------------- TABS ---------------- */

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  window.speechSynthesis.cancel();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('section.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-' + btn.dataset.tab).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>
